services:
  api:
    build: .
    image: organisations_api:local
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      PORT: "3000"
      SQLITE_FILENAME: /usr/src/app/data/dev.sqlite3
    env_file:
      - path: .env.container
        required: false
    volumes:
      - sqlite-data:/usr/src/app/data
    stop_grace_period: 65s

volumes:
  sqlite-data:
