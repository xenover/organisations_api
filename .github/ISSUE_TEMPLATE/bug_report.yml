name: Bug report
description: Describe a reproducible problem with the existing API or local workflow.
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include HTTP status/body or the failing command. Omit credentials and private data.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal steps and harmless input, including whether the SQLite database was fresh.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Node/npm versions, OS, and source/compiled/Docker/Compose mode.
    validations:
      required: true
